{% extends "base.html" %}
{% block content %}
<h2>新建{{ business_type }}客户</h2>
<form method="POST">
    <div class="form-row">
        <div class="form-group">
            <label>客户名称*</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>业务类型</label>
            <input type="text" value="{{ business_type }}" readonly style="background:#f0f0f0;">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>省份</label>
            <input type="text" name="province">
        </div>
        <div class="form-group">
            <label>区域</label>
            <input type="text" name="region">
        </div>
    </div>
    <div class="form-group">
        <label>统一信用代码</label>
        <input type="text" name="credit_code">
    </div>
    <button type="submit" class="btn btn-success">保存</button>
    <a href="{{ url_for('customer_archive', business_type=business_type) }}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
