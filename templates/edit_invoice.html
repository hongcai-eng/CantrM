{% extends "base.html" %}
{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('view_contract', id=contract.id) }}" class="btn btn-secondary">返回合同详情</a>
</div>

<h2>编辑发票记录</h2>
<p style="color: #666;">合同：{{ contract.project_name }}</p>

<form method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label>金额*</label>
        <input type="number" step="0.01" name="amount" value="{{ invoice.amount }}" required>
    </div>

    <div class="form-group">
        <label>收到日期*</label>
        <input type="date" name="received_date" value="{{ invoice.received_date }}" required>
    </div>

    <div class="form-group">
        <label>发票号</label>
        <input type="text" name="invoice_number" value="{{ invoice.invoice_number or '' }}">
    </div>

    <div class="form-group">
        <label>开具状态</label>
        <select name="invoice_status">
            <option value="未开具" {% if invoice.invoice_status == '未开具' %}selected{% endif %}>未开具</option>
            <option value="已开具" {% if invoice.invoice_status == '已开具' %}selected{% endif %}>已开具</option>
            <option value="已作废" {% if invoice.invoice_status == '已作废' %}selected{% endif %}>已作废</option>
        </select>
    </div>

    <div class="form-group">
        <label>发票类型</label>
        <select name="invoice_type">
            <option value="普票" {% if invoice.invoice_type == '普票' %}selected{% endif %}>普票</option>
            <option value="专票" {% if invoice.invoice_type == '专票' %}selected{% endif %}>专票</option>
        </select>
    </div>

    <div class="form-group">
        <label>备注</label>
        <input type="text" name="note" value="{{ invoice.note or '' }}">
    </div>

    <div class="form-group">
        <label>当前发票文件</label>
        {% if invoice.invoice_file %}
        <div style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
            {% for fname in invoice.invoice_file.split(',') %}
            <div style="margin-bottom: 5px;">
                <a href="{{ url_for('preview_file', filename=fname) }}" target="_blank">预览</a> |
                <a href="{{ url_for('download_file', filename=fname) }}">下载</a>
                <span style="color: #666; margin-left: 10px;">{{ fname }}</span>
            </div>
            {% endfor %}
            <form method="POST" action="{{ url_for('delete_invoice_file', iid=invoice.id) }}" style="display:inline; margin-top: 10px;">
                <button type="submit" class="btn btn-danger" style="padding:4px 12px;font-size:12px;" onclick="return confirm('确定删除所有发票文件？')">删除所有文件</button>
            </form>
        </div>
        {% else %}
        <p style="color: #999;">暂无文件</p>
        {% endif %}
    </div>

    <div class="form-group">
        <label>上传新的发票文件（可多选，会追加到已有文件）</label>
        <input type="file" name="invoice_file" accept=".pdf,.jpg,.jpeg,.png" multiple onchange="previewFiles(this, 'invoicePreview')">
        <div id="invoicePreview" style="margin-top:10px;"></div>
        <small style="color: #666;">支持 PDF、JPG、PNG 格式，可同时上传多个文件</small>
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{{ url_for('view_contract', id=contract.id) }}" class="btn btn-secondary">取消</a>
    </div>
</form>

<script>
function previewFiles(input, previewId) {
    const preview = document.getElementById(previewId);
    preview.innerHTML = '';
    Array.from(input.files).forEach(function(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            if (file.type.startsWith('image/')) {
                preview.innerHTML += '<img src="' + e.target.result + '" style="max-width:200px;margin:4px;">';
            } else if (file.type === 'application/pdf') {
                preview.innerHTML += '<span style="display:inline-block;padding:4px 8px;background:#eee;margin:4px;border-radius:3px;">📄 ' + file.name + '</span>';
            }
        };
        reader.readAsDataURL(file);
    });
}
</script>
{% endblock %}
