{% extends "base.html" %}
{% block content %}
<h2>添加收付款记录</h2>
<p style="color:#666;margin-bottom:20px;">合同项目：<strong>{{ contract.project_name }}</strong> | 客户：{{ contract.customer_name }}</p>

<form method="POST" action="{{ url_for('add_payment', id=contract.id) }}" enctype="multipart/form-data" style="max-width:800px;">
    <div class="form-group">
        <label>金额*</label>
        <input type="number" step="0.01" name="amount" required placeholder="请输入金额">
    </div>
    <div class="form-group">
        <label>日期*</label>
        <input type="date" name="payment_date" required>
    </div>
    <div class="form-group">
        <label>收付类型</label>
        <select name="payment_type">
            <option value="预付款">预付款</option>
            <option value="进度款">进度款</option>
            <option value="尾款">尾款</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="form-group">
        <label>备注</label>
        <textarea name="note" placeholder="可选"></textarea>
    </div>
    <div class="form-group">
        <label>收付款凭证</label>
        <input type="file" name="receipt_file" accept=".pdf,.jpg,.jpeg,.png" multiple>
        <div style="color:#888;font-size:12px;margin-top:4px;">支持 PDF、JPG、PNG 格式，可多选</div>
    </div>
    <button type="submit" class="btn btn-success">提交</button>
    <a href="javascript:history.back()" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
